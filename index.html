<style>
:root{color-scheme:light;--bg:#fff;--ink:#14102a;--muted:#5d5873;--accent:#5100c9;--accent2:#ffc825;--on:#fff;--card:#f6f2ff;--card2:#ebe2ff;--line:#ddd3f2;--wa:#25d366;--shadow:0 2px 10px rgba(81,0,201,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#25242b;--ink:#f4f2fa;--muted:#b9b5c9;--accent:#8456ff;--card:#2f2d3a;--card2:#393650;--line:#47435c;--shadow:0 2px 10px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#25242b;--ink:#f4f2fa;--muted:#b9b5c9;--accent:#8456ff;--card:#2f2d3a;--card2:#393650;--line:#47435c;--shadow:0 2px 10px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{position:relative;margin:0;background:#fff;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
section{padding:64px 20px;max-width:1200px;margin:auto}
h2{text-align:center;font-size:2rem;margin:0 0 32px}h2::after{content:"";display:block;width:56px;height:5px;border-radius:3px;background:var(--accent2);margin:10px auto 0}
.btn{display:inline-flex;gap:8px;align-items:center;padding:10px 24px;border-radius:6px;border:2px solid var(--accent);background:var(--accent);color:var(--on);font:600 1rem Cairo,Tahoma,sans-serif;text-decoration:none;cursor:pointer}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#0b2a16}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,.card:hover{border-color:var(--accent2)}.card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* hero */
.hero{min-height:88vh;display:flex;align-items:center;justify-content:center;gap:80px;flex-wrap:wrap}
.photo{width:340px;max-width:80vw;aspect-ratio:1;border-radius:50%;border:2px solid var(--accent);padding:14px}
.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--card2);display:block}
.intro{text-align:center}
.intro h1{font-size:clamp(2.8rem,8vw,4.6rem);font-weight:800;margin:0;line-height:1.2}
.intro h1 b{color:var(--accent)}
.role{font-size:1.5rem;font-weight:400;direction:ltr;margin:6px 0}
.intro p{color:var(--ink);font-size:1.15rem;margin:8px 0 20px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* works */
.tabs,.subtabs{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.tab{min-width:150px;height:64px;border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;font:600 1.05rem Cairo,Tahoma,sans-serif;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.sub{padding:8px 20px;border-radius:8px;border:0;background:var(--card2);color:var(--ink);font:600 .95rem Cairo,Tahoma,sans-serif;cursor:pointer;box-shadow:var(--shadow)}
.sub[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.hint{text-align:center;color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid.tall{grid-template-columns:repeat(4,1fr)}
.card{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line);text-decoration:none;color:#fff;background:linear-gradient(135deg,#5100c9,#1a0642)}
.tall .card{aspect-ratio:9/16}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.card .t{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;background:linear-gradient(transparent,#000a);font-weight:600;font-size:.95rem}
.card .play{position:absolute;inset:0;margin:auto;width:64px;height:44px;border-radius:12px;background:var(--accent2);display:grid;place-items:center}
.card .play::after{content:"";border-left:16px solid #1a1a1a;border-block:10px solid transparent;}
.empty{grid-column:1/-1;text-align:center;color:var(--muted)}
/* why */
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.why div{background:linear-gradient(var(--card2),var(--card));border-radius:8px;box-shadow:var(--shadow);padding:24px;text-align:center}
.why h3{margin:0 0 6px;font-weight:400;font-size:1.25rem;color:var(--accent)}
.why p{margin:0;font-size:.92rem;color:var(--muted)}
.cta{text-align:center;margin-top:28px}
/* reviews */
.rev{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:56px}
.rev figure{margin:0;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center}
.rev .st{color:var(--accent2);letter-spacing:3px}
.rev figcaption{font-weight:600;margin-top:12px}
.rev small{display:block;color:var(--muted);font-weight:400}
footer{text-align:center;padding:32px 20px;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:900px){.grid,.why,.rev{grid-template-columns:1fr 1fr}.grid.tall{grid-template-columns:1fr 1fr}.hero{gap:32px}}
@media(max-width:560px){.grid,.why,.rev,.grid.tall{grid-template-columns:1fr}section{padding:48px 16px}.tab{min-width:0;flex:1}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.tools{position:absolute;top:14px;inset-inline-end:16px;display:flex;gap:8px;z-index:5}.tool{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 14px;font:600 .9rem Cairo,Tahoma,sans-serif;cursor:pointer}.tool:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.card .t{text-align:start}
</style>
</head>

const $=s=>document.querySelector(s), R=document.documentElement;
let cat="motion", ori="wide", lang="ar";
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const sys=()=>matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
let theme=get("theme")||sys(); lang=get("lang")||"ar";
["motion","ai","edit"].forEach(k=>{const b=document.createElement("button");b.className="tab";b.dataset.k="cat_"+k;b.dataset.c=k;b.onclick=()=>{cat=k;render()};$("#cats").appendChild(b)});
document.querySelectorAll(".sub").forEach(b=>b.onclick=()=>{ori=b.dataset.o;render()});
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";put("lang",lang);render()};
$("#theme").onclick=()=>{theme=theme==="dark"?"light":"dark";put("theme",theme);render()};

function getYouTubeId(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/))([\w-]{11})/);
  return m ? m[1] : url.split("/").pop().split("?")[0];
}

function render(){
  const t=T[lang];
  R.lang=lang; R.dir=lang==="ar"?"rtl":"ltr"; R.dataset.theme=theme;
  document.title = t.title;
  const metaDesc=$("#meta-desc"); if(metaDesc) metaDesc.content=t.meta_desc;
  const ogTitle=$("#og-title"); if(ogTitle) ogTitle.content=t.title;
  const ogDesc=$("#og-desc"); if(ogDesc) ogDesc.content=t.meta_desc;
  const twTitle=$("#tw-title"); if(twTitle) twTitle.content=t.title;
  const twDesc=$("#tw-desc"); if(twDesc) twDesc.content=t.meta_desc;

  document.querySelectorAll("[data-k]").forEach(e=>{if(t[e.dataset.k]!==undefined)e.innerHTML=t[e.dataset.k]});
  $("#lang").textContent=t.lang;
  $("#theme").textContent=(theme==="dark"?"☀ ":"☾ ")+(theme==="dark"?t.light:t.dark);
  const wa="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(t.wa);
  $("#wa1").href=wa; $("#wa2").href=wa;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===cat));
  document.querySelectorAll(".sub").forEach(b=>b.setAttribute("aria-pressed",b.dataset.o===ori));
  $("#hint").textContent=t["hint_"+ori];
  
  const g=$("#grid"); g.className="grid"+(ori==="tall"?" tall":""); g.innerHTML="";
  const list=WORKS.filter(w=>w.c===cat&&w.o===ori);
  if(!list.length){g.innerHTML='<p class="empty"></p>';g.firstChild.textContent=t.empty;}
  else {
    list.forEach(w=>{
      const a=document.createElement("a");
      a.className="card"; a.href=w.url; a.target="_blank"; a.rel="noopener";
      const id=getYouTubeId(w.url);
      a.innerHTML='<img alt="" loading="lazy" src="https://img.youtube.com/vi/'+id+'/hqdefault.jpg" onerror="this.remove()"><span class="t" dir="auto"></span><span class="play"></span>';
      a.querySelector(".t").textContent=w[lang]; g.appendChild(a);
    });
  }

  const revEl=$("#reviews");
  if(revEl){
    revEl.innerHTML=REVIEWS.map(r=>`
      <figure>
        <div class="st">${r.stars}</div>
        <p>${r[lang].text}</p>
        <figcaption><span>${r[lang].name}</span><small>${r[lang].org}</small></figcaption>
      </figure>
    `).join("");
  }
}
