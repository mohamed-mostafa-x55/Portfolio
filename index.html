.tab{min-width:140px;height:56px;border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;font:600 1rem Cairo,Tahoma,sans-serif;cursor:pointer;transition:background .2s,color .2s}

const $=s=>document.querySelector(s), R=document.documentElement;
let cat="motion", ori="wide", lang="ar";
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const sys=()=>matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
let theme=get("theme")||sys(); lang=get("lang")||"ar";
["motion","ai","edit"].forEach(k=>{const b=document.createElement("button");b.className="tab";b.dataset.k="cat_"+k;b.dataset.c=k;b.onclick=()=>{cat=k;render()};$("#cats").appendChild(b)});
document.querySelectorAll(".sub").forEach(b=>b.onclick=()=>{ori=b.dataset.o;render()});
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";put("lang",lang);render()};
$("#theme").onclick=()=>{theme=theme==="dark"?"light":"dark";put("theme",theme);render()};

function getYouTubeId(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/))([\w-]{11})/);
  return m ? m[1] : url.split("/").pop().split("?")[0];
}

function render(){
  const t=T[lang];
  R.lang=lang; R.dir=lang==="ar"?"rtl":"ltr"; R.dataset.theme=theme;
  document.title = t.title;
  const metaDesc=$("#meta-desc"); if(metaDesc) metaDesc.content=t.meta_desc;
  const ogTitle=$("#og-title"); if(ogTitle) ogTitle.content=t.title;
  const ogDesc=$("#og-desc"); if(ogDesc) ogDesc.content=t.meta_desc;
  const twTitle=$("#tw-title"); if(twTitle) twTitle.content=t.title;
  const twDesc=$("#tw-desc"); if(twDesc) twDesc.content=t.meta_desc;

  document.querySelectorAll("[data-k]").forEach(e=>{if(t[e.dataset.k]!==undefined)e.innerHTML=t[e.dataset.k]});
  $("#lang").textContent=t.lang;
  $("#theme").textContent=(theme==="dark"?"☀ ":"☾ ")+(theme==="dark"?t.light:t.dark);
  const wa="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(t.wa);
  $("#wa1").href=wa; $("#wa2").href=wa;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===cat));
  document.querySelectorAll(".sub").forEach(b=>b.setAttribute("aria-pressed",b.dataset.o===ori));
  $("#hint").textContent=t["hint_"+ori];
  
  const g=$("#grid"); g.className="grid"+(ori==="tall"?" tall":""); g.innerHTML="";
  const list=WORKS.filter(w=>w.c===cat&&w.o===ori);
  if(!list.length){g.innerHTML='<p class="empty"></p>';g.firstChild.textContent=t.empty;}
  else {
    list.forEach(w=>{
      const a=document.createElement("a");
      a.className="card"; a.href=w.url; a.target="_blank"; a.rel="noopener";
      const id=getYouTubeId(w.url);
      a.innerHTML='<img alt="" loading="lazy" src="https://img.youtube.com/vi/'+id+'/maxresdefault.jpg" onerror="if(this.src.indexOf(\'maxresdefault\')!==-1){this.src=\'https://img.youtube.com/vi/'+id+'/sddefault.jpg\'}else if(this.src.indexOf(\'sddefault\')!==-1){this.src=\'https://img.youtube.com/vi/'+id+'/hqdefault.jpg\'}else{this.remove()}"><span class="t" dir="auto"></span><span class="play"></span>';
      a.querySelector(".t").textContent=w[lang];
      a.onclick = e => {
        e.preventDefault();
        openVideo(id, w.o === "tall");
      };
      g.appendChild(a);
    });
  }

  const revEl=$("#reviews");
  if(revEl){
    revEl.innerHTML=REVIEWS.map(r=>`
      <figure>
        <div class="st">${r.stars}</div>
        <p>${r[lang].text}</p>
        <figcaption><span>${r[lang].name}</span><small>${r[lang].org}</small></figcaption>
      </figure>
    `).join("");
  }
}
render();

const modal = $("#modal");
const modalBox = modal.querySelector(".modal-box");
const modalVideo = $("#modal-video");

function openVideo(id, isTall){
  modalBox.className = "modal-box" + (isTall ? " tall" : "");
  modalVideo.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeVideo(){
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  modalVideo.innerHTML = "";
  document.body.style.overflow = "";
}

modal.querySelector(".modal-backdrop").onclick = closeVideo;
modal.querySelector(".modal-close").onclick = closeVideo;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeVideo(); });
